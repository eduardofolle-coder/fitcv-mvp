name: CI

on:
  # En todas las ramas: enterarse de que algo se rompió al abrir el PR es tarde,
  # y una rama sin CI no se puede verificar antes de proponer el merge.
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

# Cancela ejecuciones viejas de la misma rama en vez de acumularlas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npx eslint src tests --ext .ts

      # Los tests levantan el servidor compilado, así que necesitan un entorno
      # coherente. Las claves son de mentira a propósito: ninguna prueba debe
      # depender de credenciales reales.
      - name: Tests
        run: npm test
        env:
          NODE_ENV: development
          JWT_PRIVATE_KEY: ci-private-key-for-tests-only-32chars
          JWT_PUBLIC_KEY: ci-public-key-for-tests-only-32chars!
          DATA_ENCRYPTION_KEY: ci-encryption-key-for-tests-32chars!
          CLAUDE_API_KEY: sk-ant-ci-placeholder-not-a-real-key

      # Solo lo que se despliega. Las devDependencies no llegan a producción,
      # así que no deberían frenar un merge.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # La suite local corre sobre PGlite, que es Postgres real pero en proceso.
  # Este job ejercita además el driver `pg` contra un servidor de verdad:
  # pool de conexiones, TLS y parseo de tipos solo se prueban por acá.
  postgres:
    name: Backend against a real PostgreSQL server
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitcv
          POSTGRES_PASSWORD: fitcv
          POSTGRES_DB: fitcv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test
        env:
          NODE_ENV: development
          DATABASE_URL: postgres://fitcv:fitcv@localhost:5432/fitcv_test
          JWT_PRIVATE_KEY: ci-private-key-for-tests-only-32chars
          JWT_PUBLIC_KEY: ci-public-key-for-tests-only-32chars!
          DATA_ENCRYPTION_KEY: ci-encryption-key-for-tests-32chars!
          CLAUDE_API_KEY: sk-ant-ci-placeholder-not-a-real-key

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: fitcv-frontend/package-lock.json

      - name: Install dependencies
        working-directory: fitcv-frontend
        run: npm ci

      - name: TypeScript check
        working-directory: fitcv-frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: fitcv-frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api

      - name: Audit production dependencies
        working-directory: fitcv-frontend
        run: npm audit --omit=dev --audit-level=high

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
