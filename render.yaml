# Blueprint de Render: Dashboard → New → Blueprint → este repositorio.
# Todo en la misma región para que el backend use la conexión interna a la BD.
# Virginia es la región de Render más cercana a Chile.

databases:
  - name: fitcv-db
    databaseName: fitcv
    user: fitcv
    # El plan gratis de Postgres se borra a los 30 días: no sirve para producción.
    plan: basic-256mb
    region: virginia

services:
  - type: web
    name: fitcv-api
    runtime: node
    region: virginia
    # El plan gratis se duerme sin tráfico y detiene la lectura de portales y el análisis diario.
    plan: starter
    branch: main
    # --include=dev: con NODE_ENV=production npm omite TypeScript y no compila.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    domains:
      - api.fitcv.cl
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fitcv-db
          property: connectionString
      # Se generan una sola vez al crear el servicio. No regenerar
      # DATA_ENCRYPTION_KEY: los CVs ya guardados quedarían ilegibles.
      - key: JWT_PRIVATE_KEY
        generateValue: true
      - key: JWT_PUBLIC_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      # sync: false = Render las pide en el panel; nunca van en el repositorio.
      # CLAUDE_API_KEY es la key de Moonshot (Kimi), no de Anthropic.
      - key: CLAUDE_API_KEY
        sync: false
      # Kimi (Moonshot) vía su endpoint compatible con Anthropic. Sin estas dos,
      # el backend usaría los defaults de Anthropic y el análisis fallaría con
      # la key de Moonshot.
      - key: CLAUDE_API_URL
        value: https://api.moonshot.ai/anthropic/v1/messages
      # kimi-k2.7-code-highspeed: el más rápido de la cuenta. K3 razonaba tanto que
      # el adaptador de CV (16k tokens) superaba los 5 min. El verificador
      # anti-mentiras corre igual, así que la seguridad no depende del modelo.
      - key: CLAUDE_MODEL
        value: kimi-k2.7-code-highspeed
      - key: CLAUDE_ORCHESTRATOR_MODEL
        value: kimi-k2.7-code-highspeed
      - key: CLAUDE_TIMEOUT_MS
        value: "300000"
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      # WhatsApp (Twilio). SID y token secretos van en el panel; el FROM es el
      # número de trial de la cuenta. En producción cambia al número de marca.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+17372508034
      # Sin dominio verificado en Resend, el remitente de prueba funciona ya.
      # Cambiar a "FITCV <no-reply@fitcv.cl>" cuando fitcv.cl esté verificado.
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      # URLs de Render mientras no exista fitcv.cl. Cambiar a https://fitcv.cl al registrarlo.
      - key: APP_URL
        value: https://fitcv-web.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://fitcv-web.onrender.com,https://fitcv.cl,https://www.fitcv.cl
      - key: OFFER_SYNC_MINUTES
        value: "60"
      - key: RUN_SCHEDULERS
        value: "true"
      # Watchdog: cada cuántos minutos revisa BD y frescura del sync.
      - key: WATCHDOG_MINUTES
        value: "10"
      # WhatsApp del admin para alertas del watchdog (opcional; vacío = solo Sentry).
      - key: ADMIN_WHATSAPP
        sync: false

  - type: web
    name: fitcv-web
    runtime: node
    region: virginia
    plan: starter
    branch: main
    rootDir: fitcv-frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    domains:
      - fitcv.cl
      - www.fitcv.cl
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Se incrusta al compilar: si cambia, hay que volver a desplegar la web.
      # URL de Render mientras no exista api.fitcv.cl. Cambiar al registrar el dominio.
      - key: NEXT_PUBLIC_API_URL
        value: https://fitcv-api.onrender.com/api
